<!--
  PROTOTYPE (LGC-23, epic 48): the members-area directory, in the sample #3 "church family hub" look.
  Question: how should the directory look and behave?
  Plan: three structurally different BROWSE layouts on one route, switched with ?variant=A|B|C
        (A household cards, B phone book with A–Z rail, C search first). The household page, edit,
        office view (audit trail + office notes) and the PDF page are shared by all three.
        ?role=member|office switches who is signed in. Routes live in the hash: #/, #/h/<id>, #/edit/<id>, #/pdf.
  Rules from projects/church-website/poc-data-model.md (LGC-12). ALL DATA IS MADE UP. State is in memory only:
  reload and every edit is gone. English only (Spanish in the POC is still open on the map).
-->
<style>
  :root { --navy: #14304d; --navy-2: #1f4a73; --sky: #e8f1fa; --sun: #f6c445; --ink: #13202e; --muted: #3e4c5a; --bg: #f4f6f8; --card: #fff; --line: #d9e0e7; --ok: #1d6b3a; --warn-bg: #fff3cd; --warn: #5c4400; --off: #6b5a00; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 400 1.1875rem/1.6 "Atkinson Hyperlegible", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  h1, h2, h3 { line-height: 1.2; margin: 0 0 .5em; }
  h1 { font-size: clamp(1.7rem, 4.5vw, 2.4rem); }
  h2 { font-size: 1.35rem; }
  h3 { font-size: 1.15rem; }
  a { color: var(--navy-2); text-underline-offset: 3px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  :focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  header.site { background: var(--navy); color: #fff; }
  header.site .wrap { display: flex; align-items: center; justify-content: space-between; min-height: 68px; gap: 12px; }
  .brand { color: #fff; text-decoration: none; font-weight: 700; font-size: 1.15rem; display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 30px; height: 30px; flex: none; }
  .who { display: flex; align-items: center; gap: 10px; font-size: 1rem; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--sun); color: var(--navy); display: grid; place-items: center; font-weight: 700; flex: none; }
  .tag { display: inline-block; background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 2px 8px; font-size: .85rem; font-weight: 700; vertical-align: middle; }
  .tag.office { background: #e3ecf7; color: var(--navy); }
  .tag.grey { background: #e9ecef; color: #333; }

  .band { background: var(--navy); color: #fff; padding: 8px 0 28px; }
  .band p { margin: 0; color: #d8e5f2; }
  .band a { color: #fff; }
  .crumb { font-size: 1rem; margin: 0 0 8px; }
  .crumb a { color: #d8e5f2; }
  main { padding-top: 20px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 12px;
    background: var(--navy); color: #fff; text-decoration: none; font: 700 1.05rem "Atkinson Hyperlegible", sans-serif; border: 2px solid var(--navy); cursor: pointer; }
  .btn:hover { background: var(--navy-2); border-color: var(--navy-2); }
  .btn.ghost { background: #fff; color: var(--navy); }
  .btn.ghost:hover { background: var(--sky); }
  .btn.small { min-height: 44px; padding: 0 14px; font-size: 1rem; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; margin-bottom: 20px; }
  .muted { color: var(--muted); }
  .small { font-size: 1rem; }

  /* search box shared by the variants */
  .search { display: flex; gap: 8px; align-items: stretch; }
  .search input { flex: 1; min-height: 56px; font: inherit; padding: 0 16px; border: 2px solid #8a98a6; border-radius: 12px; background: #fff; color: var(--ink); min-width: 0; }
  .search input:focus { border-color: var(--navy-2); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
  .chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-size: 1rem; cursor: pointer; }
  .chip input { width: 20px; height: 20px; margin: 0; }

  /* Variant A: household cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 18px; }
  .hh-card { display: flex; gap: 14px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; text-decoration: none; color: var(--ink); min-height: 104px; }
  .hh-card:hover { border-color: var(--navy-2); background: var(--sky); }
  .hh-card .ini { width: 56px; height: 56px; border-radius: 14px; background: var(--sky); color: var(--navy); display: grid; place-items: center; font-weight: 700; font-size: 1.2rem; flex: none; }
  .hh-card b { display: block; font-size: 1.15rem; }
  .hh-card .people { color: var(--muted); font-size: 1rem; }

  /* Variant B: phone book */
  .book { display: grid; grid-template-columns: 1fr 52px; gap: 12px; margin-top: 18px; }
  .rail { position: sticky; top: 8px; align-self: start; display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 4px 0; }
  .rail a, .rail span { min-height: 30px; display: grid; place-items: center; font-weight: 700; font-size: 1rem; text-decoration: none; }
  .rail span { color: #9aa5b1; font-weight: 400; }
  .letter { font-size: 1.4rem; color: var(--navy); border-bottom: 3px solid var(--sun); display: inline-block; margin: 18px 0 6px; scroll-margin-top: 12px; }
  .book details { background: #fff; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
  .book summary { list-style: none; cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; min-height: 56px; }
  .book summary::-webkit-details-marker { display: none; }
  .book summary .nm { font-weight: 700; font-size: 1.15rem; }
  .book summary .ph { white-space: nowrap; }
  .book summary .ad { color: var(--muted); font-size: 1rem; grid-column: 1 / -1; }
  .book summary::after { content: "Show family ▾"; grid-column: 1 / -1; font-size: .95rem; color: var(--navy-2); }
  .book details[open] summary::after { content: "Hide ▴"; }
  .book .inner { padding: 0 16px 14px; border-top: 1px solid var(--line); }

  /* Variant C: search first */
  .hero-search { background: var(--card); border-radius: 16px; box-shadow: 0 8px 28px rgba(20, 48, 77, .14); padding: 22px; margin-top: -20px; }
  .hero-search label { font-weight: 700; font-size: 1.3rem; display: block; margin-bottom: 10px; }
  .results { list-style: none; padding: 0; margin: 16px 0 0; }
  .results li a { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 14px 16px; min-height: 64px; background: #fff; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; text-decoration: none; color: var(--ink); }
  .results li a:hover { background: var(--sky); border-color: var(--navy-2); }
  .results b { font-size: 1.15rem; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }

  /* household page */
  .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; align-items: start; }
  ul.plain { list-style: none; margin: 0; padding: 0; }
  ul.plain > li { padding: 14px 0; border-top: 1px solid var(--line); }
  ul.plain > li:first-child { border-top: 0; padding-top: 0; }
  .person-name { font-weight: 700; font-size: 1.2rem; }
  .rel { color: var(--muted); font-size: 1rem; }
  dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 6px 0 0; font-size: 1.05rem; }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { margin: 0; overflow-wrap: anywhere; }
  .hidden-note { font-size: .95rem; color: var(--off); }
  .stamp { font-size: 1rem; color: var(--muted); margin: 12px 0 0; }

  /* office panels */
  .office-panel { border: 2px solid #b9cbe0; background: #f7fafd; }
  .office-panel h2::before { content: "🔒 "; }
  .note { border-left: 4px solid var(--line); padding: 6px 0 6px 12px; margin: 10px 0; }
  .note.contact { border-left-color: var(--ok); }
  .note.struck .txt { text-decoration: line-through; color: var(--muted); }
  .note .meta { font-size: .95rem; color: var(--muted); }
  textarea, select, input[type=text], input[type=email], input[type=tel], input[type=date] { font: inherit; min-height: 48px; padding: 8px 12px; border: 2px solid #8a98a6; border-radius: 10px; width: 100%; background: #fff; color: var(--ink); }
  textarea { min-height: 90px; }
  table.audit { width: 100%; border-collapse: collapse; font-size: .95rem; }
  table.audit th, table.audit td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  table.audit td.old { color: #8a1c1c; text-decoration: line-through; }
  table.audit td.new { color: var(--ok); }
  .tablewrap { overflow-x: auto; }

  /* edit form */
  fieldset { border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin: 0 0 18px; background: #fff; }
  legend { font-weight: 700; font-size: 1.2rem; padding: 0 6px; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; font-weight: 700; margin-bottom: 4px; }
  .field .hint { font-size: .95rem; color: var(--muted); margin: 2px 0 6px; }
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .check { display: flex; gap: 10px; align-items: center; min-height: 44px; font-size: 1rem; }
  .check input { width: 24px; height: 24px; margin: 0; flex: none; }
  .flash { background: #e6f4ea; border: 2px solid var(--ok); color: #0f3d20; border-radius: 12px; padding: 12px 16px; margin-bottom: 18px; }

  /* PDF mock */
  .sheet { background: #fff; width: 100%; max-width: 8.5in; margin: 0 auto 24px; padding: .55in .5in; box-shadow: 0 6px 24px rgba(0,0,0,.18); font: 10.5pt/1.35 "Atkinson Hyperlegible", sans-serif; color: #000; }
  .sheet header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
  .sheet header b { font-size: 15pt; }
  .sheet .cols { columns: 2 3in; column-gap: .35in; }
  .sheet .entry { break-inside: avoid; margin: 0 0 9pt; }
  .sheet .entry .hn { font-weight: 700; font-size: 11.5pt; border-bottom: 1px solid #999; }
  .sheet .entry div { margin-left: 0; }
  .sheet .entry .kid { margin-left: 12pt; }
  .sheet .foot { border-top: 1px solid #000; margin-top: 10px; padding-top: 4px; font-size: 8.5pt; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

  .proto { margin-top: 24px; font-size: .95rem; }
  .proto pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #1b1b1f; color: #e8e8e8; padding: 12px; border-radius: 10px; font-size: .85rem; max-height: 360px; overflow: auto; }

  @media (max-width: 860px) {
    .grid, .two, .fgrid { grid-template-columns: 1fr; }
    .who .name { display: none; }
  }
  @media print {
    body { background: #fff; padding: 0; }
    .demo-banner, header.site, .band, .no-print, .demo-bar, .skip-link, .proto { display: none !important; }
    main { padding: 0; }
    .wrap { max-width: none; padding: 0; }
    .sheet { box-shadow: none; padding: 0; max-width: none; margin: 0; }
    @page { size: letter; margin: .5in; }
  }
</style>
</head>

  const P = (id) => people.find((p) => p.id === id);

  const age = (p) => { const d = new Date(p.dob + 'T12:00:00'); let a = TODAY.getFullYear() - d.getFullYear(); const m = TODAY.getMonth() - d.getMonth(); if (m < 0 || (m === 0 && TODAY.getDate() < d.getDate())) a--; return a; };
  const isMinor = (p) => age(p) < 18;

  const display = (p) => (p.pref ? `${p.pref}` : p.first);
  const fullName = (p) => `${display(p)} ${p.last}`;
  const members = (hhId) => people.filter((p) => p.hh === hhId);

  const adults = (hhId) => members(hhId).filter((p) => active(p) && !isMinor(p));
  function hhName(h) {
    const ad = adults(h.id);
    let list = ad.length ? ad : members(h.id).filter(active);
    if (!list.length) return `${h.id[0].toUpperCase() + h.id.slice(1)} household`;
    // The surname most of the adults share leads; ties go to the oldest. Others follow with their own surname.
    const counts = {}; list.forEach((p) => { counts[p.last] = (counts[p.last] || 0) + 1; });

  }
  const surname = (h) => hhName(h).split(',')[0];
  function listedForMembers(h) {
    if (h.optOut) return false;
    return members(h.id).some((p) => active(p) && p.status !== 'visitor');
  }
  function hhVisible(h) {
    if (!isOffice()) return listedForMembers(h);
    const ms = members(h.id);
    if (h.optOut && !officeShow.optedOut) return false;

    return { show: !p.hide[field], hidden: !!p.hide[field] };
  }
  function relationsOf(p) {
    const out = [];
    const deceased = (x) => x.inactive && x.inactive.reason === 'deceased';
    rels.forEach((r) => {
      if (r.type === 'spouse' && (r.a === p.id || r.b === p.id)) {

      if (r.type === 'guardian' && r.a === p.id) out.push({ label: 'Guardian of', o: P(r.b) });
      if (r.type === 'guardian' && r.b === p.id) out.push({ label: 'Guardian', o: P(r.a) });

      </div></div>
      <details class="proto no-print"><summary>Prototype: the raw records behind this page</summary><pre>${esc(JSON.stringify({ household: h, people: members(id), relationships: rels.filter((r) => members(id).some((p) => p.id === r.a || p.id === r.b)) }, null, 2))}</pre></details>
      </div></main>`;
    app.innerHTML = html;
    flash = '';
    const f = document.getElementById('note-form');
    if (f) f.addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(f);
      const text = String(fd.get('text') || '').trim(); if (!text) return;
      const contact = fd.get('contact') ? String(fd.get('cdate') || '2026-11-11') : null;
      notes.push({ id: Date.now(), hh: id, person: fd.get('person') || null, by: 'Brynna (office)', at: '2026-11-11', text, contact });
      flash = contact ? 'Note added and counted as a contact.' : 'Note added.';
      render();
    });
    app.querySelectorAll('[data-strike]').forEach((b) => b.addEventListener('click', () => { const n = notes.find((x) => x.id == b.dataset.strike); n.struck = true; notes.push({ id: Date.now(), hh: id, person: n.person, by: 'Brynna (office)', at: '2026-11-11', text: `Struck through the note of ${md(n.at)} as a mistake.`, contact: null }); render(); }));
  }

  function officeNotesPanel(h) {
    const ns = notes.filter((n) => n.hh === h.id).sort((a, b) => b.at.localeCompare(a.at) || b.id - a.id);
    const opts = members(h.id).filter(active).map((p) => `<option value="${p.id}">${esc(fullName(p))}</option>`).join('');
    return `<section class="card office-panel" aria-labelledby="notes-h"><h2 id="notes-h">Office notes</h2>
      <p class="small muted" style="margin-top:0">Office admins only. Never shown to the people they're about, and never in the PDF or bulletin. Notes can't be edited: add a follow-up or strike one through.</p>
      ${ns.map((n) => `<div class="note${n.contact ? ' contact' : ''}${n.struck ? ' struck' : ''}"><div class="txt">${esc(n.text)}</div><div class="meta">${n.person ? esc(fullName(P(n.person))) : 'Whole household'} · ${esc(n.by)} · ${md(n.at)}${n.contact ? ` · <b>✓ contact ${md(n.contact)}</b>` : ''}${!n.struck ? ` · <button type="button" class="linkbtn" data-strike="${n.id}" style="background:none;border:0;padding:0;font:inherit;color:var(--navy-2);text-decoration:underline;cursor:pointer;min-height:24px">strike through</button>` : ' · struck through'}</div></div>`).join('') || '<p class="muted">No notes yet.</p>'}
      <form id="note-form" style="margin-top:14px"><div class="field"><label for="n-person">About</label><select id="n-person" name="person"><option value="">Whole household</option>${opts}</select></div>
      <div class="field"><label for="n-text">Note</label><textarea id="n-text" name="text" required></textarea></div>
      <label class="check"><input type="checkbox" name="contact" checked> This was a contact (call, visit, card)</label>
      <div class="field"><label for="n-date">Contact date</label><input type="date" id="n-date" name="cdate" value="2026-11-11"></div>
      <button class="btn small" type="submit">Add note</button></form></section>`;
  }
  function auditPanel(h) {
    const rows = audit.filter((a) => a.hh === h.id).sort((a, b) => b.at.localeCompare(a.at));
    return `<section class="card office-panel" aria-labelledby="audit-h"><h2 id="audit-h">Change history</h2>
      <p class="small muted" style="margin-top:0">Every change, kept for good, including deletions. Office admins only.</p>
      ${rows.length ? `<div class="tablewrap"><table class="audit"><thead><tr><th scope="col">When</th><th scope="col">By</th><th scope="col">What</th><th scope="col">Was</th><th scope="col">Now</th></tr></thead><tbody>${rows.map((a) => `<tr><td>${esc(a.at)}</td><td>${esc(a.by)}</td><td>${esc(a.who)}: ${esc(a.field)}</td><td class="old">${esc(a.old || '—')}</td><td class="new">${esc(a.new || '—')}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No changes recorded.</p>'}</section>`;
  }

  function viewEdit(id) {
    const h = H(id);
    if (!h || !canEdit(h)) { app.innerHTML = band('Can\'t edit this household', '', '<a href="#/">Directory</a>') + `<main id="main" class="wrap"><p>${h && !adults(id).length ? 'A household with no adults is edited by the office only.' : 'You can edit your own household. Ask the office to change anyone else\'s.'}</p><p><a href="#/h/${id}">Back</a></p></main>`; return; }
    const ps = (isOffice() ? members(id) : members(id).filter(active)).sort((a, b) => isMinor(a) - isMinor(b) || a.dob.localeCompare(b.dob));
    const inp = (pid, f, label, type, val, hint) => `<div class="field"><label for="${pid}-${f}">${label}</label>${hint ? `<div class="hint" id="${pid}-${f}-h">${hint}</div>` : ''}<input type="${type}" id="${pid}-${f}" name="${pid}.${f}" value="${esc(val)}" ${hint ? `aria-describedby="${pid}-${f}-h"` : ''}></div>`;
    const hideBox = (p, f, label) => `<label class="check"><input type="checkbox" name="${p.id}.hide.${f}" ${p.hide[f] ? 'checked' : ''}> Hide my ${label} from other members</label>`;
    app.innerHTML = band(`Edit ${esc(hhName(h))}`, isOffice() ? 'Office: you can change anything. Every change goes into the change history.' : 'Changes show in the directory straight away. The office can see what changed.', `<a href="#/">Directory</a> › <a href="#/h/${id}">Household</a> › Edit`) +
      `<main id="main"><form class="wrap" id="edit" style="max-width:820px">
      <fieldset><legend>Home</legend>
        ${inp('hh', 'address', 'Address', 'text', h.address)}
        ${inp('hh', 'home', 'Home phone (landline)', 'tel', h.home, 'Leave blank if you don\'t have one.')}
        <label class="check"><input type="checkbox" name="hh.hideAddress" ${h.hideAddress ? 'checked' : ''}> Hide our address from other members</label>
        <label class="check"><input type="checkbox" name="hh.optOut" ${h.optOut ? 'checked' : ''}> Leave our whole household out of the directory and the PDF</label>
      </fieldset>
      ${ps.map((p) => {
        const minor = isMinor(p);
        return `<fieldset><legend>${esc(fullName(p))}${minor ? ' (child)' : ''}</legend>
        <div class="fgrid">${inp(p.id, 'first', 'First name', 'text', p.first)}${inp(p.id, 'last', 'Last name', 'text', p.last)}</div>
        <div class="fgrid">${inp(p.id, 'pref', 'Goes by (optional)', 'text', p.pref)}${inp(p.id, 'dob', 'Date of birth', 'date', p.dob, isOffice() ? '' : 'Other members see the month and day only.')}</div>
        ${inp(p.id, 'cell', 'Cellphone (optional)', 'tel', p.cell, minor ? 'For a child, only your household and the office see this.' : '')}
        ${!minor ? hideBox(p, 'cell', 'cellphone') : ''}
        ${inp(p.id, 'email', 'Email (optional)', 'email', p.email, minor ? 'For a child, only your household and the office see this. Children can\'t sign in.' : (p.id === ME().person ? 'This is the address your sign-in link goes to.' : 'Each email belongs to one person. Sign-in links go here.'))}
        ${!minor ? hideBox(p, 'email', 'email') : ''}
        ${isOffice() ? `<div class="fgrid"><div class="field"><label for="${p.id}-status">Status (office only)</label><select id="${p.id}-status" name="${p.id}.status">${['member', 'regular', 'visitor'].map((s) => `<option value="${s}" ${p.status === s ? 'selected' : ''}>${s === 'regular' ? 'Regular attender' : s[0].toUpperCase() + s.slice(1)}</option>`).join('')}</select></div>
          <div class="field"><label for="${p.id}-inactive">Inactive (office only)</label><select id="${p.id}-inactive" name="${p.id}.inactive"><option value="">Active</option>${['deceased', 'moved', 'left'].map((r) => `<option value="${r}" ${p.inactive && p.inactive.reason === r ? 'selected' : ''}>Inactive: ${r}</option>`).join('')}</select></div></div>` : ''}
        </fieldset>`;
      }).join('')}
      <p class="small muted">${isOffice() ? '' : 'To add or remove someone, or move them to another household, ask the office.'}</p>
      <div class="row"><button class="btn" type="submit">Save changes</button><a class="btn ghost" href="#/h/${id}">Cancel</a></div></form></main>`;
    document.getElementById('edit').addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const by = isOffice() ? 'Office (Brynna)' : 'Sam Sample';
      const stamp = '2026-11-11 ' + new Date().toTimeString().slice(0, 5);
      let n = 0;
      const log = (who, field, old, nu) => { if (String(old ?? '') === String(nu ?? '')) return false; audit.push({ at: stamp, by, who, field, old: String(old ?? ''), new: String(nu ?? ''), hh: id }); n++; return true; };
      ['address', 'home'].forEach((f) => { const v = fd.get('hh.' + f); if (log('Household', f === 'home' ? 'home phone' : f, h[f], v)) h[f] = v; });
      [['hideAddress', 'address hidden'], ['optOut', 'opted out']].forEach(([f, label]) => { const v = !!fd.get('hh.' + f); if (log('Household', label, h[f] ? 'yes' : 'no', v ? 'yes' : 'no')) h[f] = v; });
      ps.forEach((p) => {
        const nm = fullName(p);
        [['first', 'first name'], ['last', 'last name'], ['pref', 'goes by'], ['dob', 'date of birth'], ['cell', 'cellphone'], ['email', 'email']].forEach(([f, label]) => { const v = fd.get(`${p.id}.${f}`); if (v !== null && log(nm, label, p[f], v)) p[f] = v; });
        ['cell', 'email'].forEach((f) => { if (isMinor(p)) return; const v = !!fd.get(`${p.id}.hide.${f}`); if (log(nm, `${f === 'cell' ? 'cellphone' : 'email'} hidden`, p.hide[f] ? 'yes' : 'no', v ? 'yes' : 'no')) p.hide[f] = v; });
        if (isOffice()) {
          const s = fd.get(`${p.id}.status`); if (log(nm, 'status', p.status, s)) p.status = s;
          const ia = fd.get(`${p.id}.inactive`); const old = p.inactive ? p.inactive.reason : '';
          if (log(nm, 'inactive', old, ia)) p.inactive = ia ? { reason: ia, date: '2026-11-11' } : null;
        }
      });
      if (n) h.updated = { by, at: '2026-11-11' };
      flash = n ? `Saved. ${n} ${n === 1 ? 'change' : 'changes'} recorded in the change history${isOffice() ? ' (below)' : ' (the office can see them; switch to Office in the bar to look)'}.` : 'Nothing changed.';
      location.hash = '#/h/' + id;
    });
  }

  function viewPDF() {
    const hs = households.filter(listedForMembers).sort((a, b) => hhName(a).localeCompare(hhName(b)));
    const entry = (h) => {
      const ps = members(h.id).filter((p) => active(p) && p.status !== 'visitor').sort((a, b) => isMinor(a) - isMinor(b) || a.dob.localeCompare(b.dob));
      const ad = ps.filter((p) => !isMinor(p)); const kids = ps.filter(isMinor);
      const sp = rels.find((r) => r.type === 'spouse' && ad.some((p) => p.id === r.a) && ad.some((p) => p.id === r.b));
      return `<div class="entry"><div class="hn">${esc(hhName(h))}</div>
        ${!h.hideAddress ? `<div>${esc(h.address)}</div>` : ''}${h.home ? `<div>Home ${esc(h.home)}</div>` : ''}
        ${ad.map((p) => `<div><b>${esc(display(p))}</b> · b. ${md(p.dob)}${p.cell && !p.hide.cell ? ` · ${esc(p.cell)}` : ''}${p.email && !p.hide.email ? ` · ${esc(p.email)}` : ''}</div>`).join('')}
        ${sp ? `<div>Married ${md(sp.anniversary)}</div>` : ''}
        ${kids.length ? `<div class="kid">Children: ${kids.map((k) => `${esc(display(k))} (${md(k.dob)})`).join(', ')}</div>` : ''}</div>`;
    };
    app.innerHTML = band('Directory PDF', 'What the Download PDF button produces: letter size, two columns, households A–Z. Use Print below, or your browser\'s Save as PDF.', '<a href="#/">Directory</a> › PDF') +
      `<main id="main"><div class="wrap"><div class="row no-print" style="margin-bottom:16px"><button class="btn" type="button" id="print">Print / save as PDF</button><a class="btn ghost" href="#/">Back to the directory</a></div>
      <p class="small muted no-print">Left out on purpose: households that opted out, hidden fields, visitors, inactive people, and every child's phone and email. ${isOffice() ? 'The office gets the same PDF as members.' : ''}</p>
      <article class="sheet" aria-label="Directory PDF preview"><header><b>La Grange Church of Christ: Member directory</b><span>November 2026</span></header>
      <div class="cols">${hs.map(entry).join('')}</div>
      <div class="foot"><span>For members of La Grange Church of Christ only. Please don't share it or post it online.</span><span>Changes? Update your household in the members area, or call the office.</span></div></article></div></main>`;
    document.getElementById('print').addEventListener('click', () => window.print());
  }

  // ---------- router + switcher ----------
  function render() {
    who();
    const hash = location.hash || '#/';
    let m;
    if ((m = hash.match(/^#\/h\/(\w+)/))) viewHousehold(m[1]);
    else if ((m = hash.match(/^#\/edit\/(\w+)/))) viewEdit(m[1]);
    else if (hash.startsWith('#/pdf')) viewPDF();
    else viewBrowse();
    bar();
  }
  let lastHash = location.hash;
  window.addEventListener('hashchange', () => { render(); if (location.hash !== lastHash) { window.scrollTo(0, 0); const h = document.getElementById('page-h'); if (h) h.focus(); } lastHash = location.hash; });

  function bar() {
    let b = document.querySelector('.demo-bar');
    if (!b) { b = document.createElement('nav'); b.className = 'demo-bar'; b.setAttribute('aria-label', 'Prototype controls'); document.body.appendChild(b); }
    const keys = Object.keys(VARIANTS);
    b.innerHTML = `<button type="button" data-v="-1" aria-label="Previous layout">‹</button><span style="padding:0 6px;color:#fff;white-space:nowrap">${variant}<span class="label">&nbsp;(${VARIANTS[variant]})</span></span><button type="button" data-v="1" aria-label="Next layout">›</button>
      <span class="sep" aria-hidden="true"></span><button type="button" id="role" aria-pressed="${isOffice()}">${isOffice() ? 'Office' : 'Member'}<span class="label">&nbsp;view</span></button>`;
    b.querySelectorAll('[data-v]').forEach((x) => x.addEventListener('click', () => cycle(Number(x.dataset.v))));
    b.querySelector('#role').addEventListener('click', () => { role = isOffice() ? 'member' : 'office'; setURL(); render(); });
    function cycle(d) { const i = (keys.indexOf(variant) + d + keys.length) % keys.length; variant = keys[i]; setURL(); if (location.hash && location.hash !== '#/') location.hash = '#/'; else render(); }
    window.__cycle = cycle;
  }
  document.addEventListener('keydown', (e) => {
    const t = e.target; if (t.closest && t.closest('input, textarea, select, [contenteditable]')) return;
    if (e.key === 'ArrowLeft') window.__cycle(-1); if (e.key === 'ArrowRight') window.__cycle(1);
  });
  setURL();
  render();
})();
</script>
</body>
</html>
