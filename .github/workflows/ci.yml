name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
    env:
      APOS_MONGODB_URI: mongodb://localhost:27017/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and test
        run: |
          # The root package (once it exists) runs everything, workspaces included.
          # Until then, each package under packages/ is installed and tested on its own.
          if [ -f package.json ]; then
            npm ci
            npm test
          else
            found=0
            for d in packages/*/; do
              if [ -f "$d/package.json" ]; then
                found=1
                echo "::group::$d"
                (cd "$d" && npm ci && npm test)
                echo "::endgroup::"
              fi
            done
            [ "$found" = 1 ] || echo "No package.json yet; nothing to test."
          fi
