name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
    env:
      APOS_MONGODB_URI: mongodb://localhost:27017/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and test
        run: |
          if [ -f package.json ]; then
            npm ci
            npm test
          else
            echo "No package.json yet; nothing to test."
          fi
